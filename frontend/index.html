<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playlist MP3 Downloader</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="app-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">SoundCloud + YouTube</p>
            <h1>Playlist MP3 Downloader</h1>
            <p class="lede">Paste a public playlist URL and download a zip of MP3 files named with artist and track titles when the source provides that metadata.</p>
          </div>
        </header>

        <form id="downloadForm" class="download-form">
          <label>
            Playlist URL
            <input name="url" type="url" placeholder="https://soundcloud.com/artist/sets/playlist" required />
          </label>
          <button class="primary" type="submit">Download MP3s</button>
        </form>

        <p class="hint">Supported sources: public YouTube playlists, YouTube Music playlists, and SoundCloud playlists.</p>
        <p class="message" id="message"></p>
        <div class="jobs" id="jobs"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
